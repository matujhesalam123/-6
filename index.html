<!DOCTYPE html>

            50% { box-shadow: 0 0 20px rgba(203, 213, 225, 0.9); border-color: #cbd5e1; }
        }

        @keyframes bronzeGlow {

        .letter-box-container {
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
            margin-top: 1px;
            margin-bottom: 1px;
        }

        .letter-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 20px;
            border: 1px solid #0f172a;
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            line-height: 20px;
            margin-right: -1px;
            background-color: #ffffff;
            color: #0f172a;
            box-sizing: border-box;
            flex-shrink: 0;
            font-family: monospace, 'Noto Sans Devanagari', sans-serif;
        }

        .form-table {
            border-collapse: collapse;
            width: 100%;
        }

        .fill-line {

    <!-- Navigation handler script: shows/hides sections and updates active buttons -->
    <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.showSection = function (name) {
        // hide all sections
        document.querySelectorAll('.content-section').forEach(function (sec) {
          sec.classList.add('hidden');
        });

        // show requested section
        var target = document.getElementById('section-' + name);
        if (target) {
          target.classList.remove('hidden');
          // optional: scroll to top of main area
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // update active class on sidebar buttons
        document.querySelectorAll('.tab-btn').forEach(function (b) {
          b.classList.remove('active');
        });
        var btn = document.getElementById('btn-' + name);
        if (btn) btn.classList.add('active');

        // update toolbar title (use button text if available)
        var titleElem = document.getElementById('currentActiveSectionTitle');
        if (titleElem) {
          var label = name;
          if (btn) {
            var span = btn.querySelector('span');
            if (span && span.innerText.trim()) label = span.innerText.trim();
          }
          titleElem.innerText = 'अनुभाग: ' + label;
        }

        // re-render icons if lucide is present
        if (window.lucide && typeof lucide.replace === 'function') {
          try { lucide.replace(); } catch (e) { /* ignore */ }
        }
      };

      // show dashboard by default on load
      if (!document.querySelectorAll('.tab-btn.active').length) {
        showSection('dashboard');
      } else {
        var activeBtn = document.querySelector('.tab-btn.active');
        if (activeBtn && activeBtn.id && activeBtn.id.startsWith('btn-')) {
          var name = activeBtn.id.replace(/^btn-/, '');
          showSection(name);
        } else {
          showSection('dashboard');
        }
      }
    });
    </script>
</body>
